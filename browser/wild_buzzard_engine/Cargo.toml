[package]
name = "wild_buzzard_engine"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.90"
description = "Typed static-page integration seam for the Wild Buzzard browser engine"
publish = false

[dependencies]
num-traits = "0.2"
wild_buzzard_dom = { path = "../../dom" }
wild_buzzard_headless = { path = "../../gfx/wild_buzzard_headless" }
wild_buzzard_html = { path = "../../parser" }
wild_buzzard_layout = { path = "../../layout" }
wild_buzzard_net = { path = "../../netwerk/rust/wild_buzzard_net" }
wild_buzzard_renderer = { path = "../../gfx/wild_buzzard_renderer" }
wild_buzzard_stylo_adapter = { path = "../../servo/components/wild_buzzard_stylo_adapter" }
wild_buzzard_text = { path = "../../gfx/wild_buzzard_text" }

[lib]
path = "src/lib.rs"

# This crate is intentionally testable without changing the root workspace.
[workspace]
resolver = "2"
