[package]
name = "wild_buzzard_script"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MPL-2.0"
description = "Browser-owned parser and JavaScript coordination for Wild Buzzard"
publish = false

[dependencies]
brimstone_core = { path = "../../js/brimstone/src/js", optional = true }
wild_buzzard_dom = { path = "../../dom", optional = true }
wild_buzzard_dom_script_bridge = { path = "../../dom/script_bridge", optional = true }
wild_buzzard_html = { path = "../../parser", optional = true }
wild_buzzard_net = { path = "../../netwerk/rust/wild_buzzard_net", optional = true }

[features]
default = []
contained_inline_classic = [
    "dep:brimstone_core",
    "dep:wild_buzzard_dom",
    "dep:wild_buzzard_dom_script_bridge",
    "dep:wild_buzzard_html",
    "dep:wild_buzzard_net",
]

[lib]
path = "src/lib.rs"

[workspace]
resolver = "2"

[patch.crates-io]
indexmap-allocator-api = { git = "https://github.com/Hans-Halverson/indexmap-allocator-api.git", rev = "36852f985c01fb9f58f2d9e510655ca1dbb1f4d0" }
