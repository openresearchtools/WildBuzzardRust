  "tikv-jemallocator builds the third-party jemalloc allocator on Linux when the default jemalloc feature is active",
]
network_build_inputs = [
  "Cargo currently resolves a lockfile-pinned indexmap-allocator-api fork from https://github.com/Hans-Halverson/indexmap-allocator-api.git; vendor or otherwise admit this dependency before reproducible/offline product builds",
]
notes = "Exact upstream source snapshot selected as Wild Buzzard's canonical JavaScript execution-engine baseline. Upstream states that it is not production-ready and that its compacting collector contains extensive unsafe code. It is not a root-workspace dependency and must not execute untrusted browser content until its public Context/handle ownership, rooting, GC, limits, interruption, module loading, host-object boundary, and process-scale memory behavior pass the gates in AGENTS.md. The existing wild_buzzard_js interpreter is transitional contract/regression material and must not become a second live page heap."
local_patches = [
  "Added WILDBUZZARD_UPSTREAM.md beside, but not as part of, the exact upstream snapshot to record the pin and admission state.",
]

