notes = "Retain WebDriver protocol behavior, but replace Marionette and Firefox process/profile assumptions with the Wild Buzzard engine facade."

[[component]]
name = "preference parser"
owner = "agent-1-foundation-platform"
status = "active"
source_repository = "https://github.com/mozilla-firefox/firefox.git"
source_revision = "c19b7e89270787889495688244ec6ee8e79288a1"
source_paths = ["modules/libpref/parser"]
destination_paths = ["modules/libpref/parser"]
licenses = ["MPL-2.0"]
editable = true
standalone_manifest = "modules/libpref/parser/Cargo.toml"

[[component]]
name = "skv"
owner = "agent-5-network-security-storage"
status = "active"
source_repository = "https://github.com/mozilla-firefox/firefox.git"
source_revision = "c19b7e89270787889495688244ec6ee8e79288a1"
source_paths = ["third_party/skv"]
destination_paths = ["third_party/skv"]
licenses = ["MPL-2.0"]
editable = true
standalone_manifest = "third_party/skv/Cargo.toml"

[excluded]
unsupported_platforms = [
  "Windows",
  "macOS",
  "Android",
  "iOS",
  "non-x86_64 architectures",
]
telemetry = [
  "toolkit/components/glean",
  "toolkit/components/dap",
  "services/telemetry",
]
provider_services = [
  "Firefox Accounts",
  "Mozilla Sync clients",
  "Pocket",
  "Relay",
  "VPN",
  "Monitor",
  "Nimbus",
  "remote settings",
  "sponsored suggestions",
  "ads",
]
reference_only_adapters = [
  "servo/ports/geckolib",
  "gfx/webrender_bindings",
  "gfx/wgpu_bindings",
  "netwerk/socket/neqo_glue",
  "netwerk/base/mozurl",
  "xpcom/rust Gecko/XPCOM adapter crates (excluding admitted malloc_size_of_derive)",
  "toolkit/library/rust",
]
