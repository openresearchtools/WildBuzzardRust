schema = 1
project = "Wild Buzzard"
updated_at = "2026-08-09"
overall_status = "implementation-foundation"
runnable_browser = false
firefox_engine_parity = false
firefox_ui_parity = false
normal_websites_verified = false
youtube_verified = false
supported_rust_target = "x86_64-unknown-linux-gnu"
release_artifact = "AppImage"

[baseline]
firefox_branch = "esr153"
firefox_revision = "c19b7e89270787889495688244ec6ee8e79288a1"
reference_checkout = "firefox"
reference_is_build_input = false

[completion]
summary = "The program completes only when the Rust-native browser and UI run normal websites, including JavaScript-heavy sites such as YouTube, and the recorded Firefox ESR engine/UI parity gates pass."
required_evidence = [
  "Rust-native Linux x86_64 browser executable and browser chrome",
  "No first-party C or C++ runtime implementation and no dependency on the firefox reference checkout",
  "Test262 and WebAssembly specification conformance reports",
  "Web Platform Test, CSS, reftest, accessibility, WebDriver, network, storage, media, and security reports",
  "Normal-site compatibility suite with JavaScript enabled",
  "YouTube navigation, script execution, layout, input, audio/video playback, and recovery smoke tests",
  "Firefox ESR engine behavior and Rust UI capability parity matrix with every gap closed or explicitly accepted",
  "Relocatable Linux x86_64 AppImage plus privacy/prohibited-endpoint audit",
]

[orchestration]
max_concurrent_agents = 4
main_agent_role = "integration, review, root manifests, contracts, tests, parity evidence, commits"
external_build_root = "../wildbuzzardbuilds"
commit_policy = "Integrate and push coherent, reviewed waves; agents do not commit independently."
javascript_lane_policy = "Keep Agent 2 continuously staffed. JS, Wasm, GC, rooting, host bindings, and optimization remain one critical architectural program."
javascript_engine = "Brimstone exact upstream baseline at bfb720f0afb8b2b28b27c22ee7091deb7d16b082; prohibited for untrusted browser content until hardening gates pass"
javascript_jit_target = "Cranelift baseline and optimizing tiers for x86_64-unknown-linux-gnu"
javascript_jit_status = "W3-A2M proves only an off-by-default bounded actual-VM side-exit continuation; generated native breadth remains tiny and product dispatch is compile-time false"
webassembly_core = "Selected imported Wasmtime v47.0.3 source at 5554cc1a651da536af2cc46c7324bdc085b162e3 plus the product-disconnected first-party js/wasm adapter with minimal Cranelift core features; no WASI exposure"
static_integration = "W2-A6C connects W2-A6, W2-A4D, and W2-A6N: the bounded synchronous engine retains every canonical finalized shape, submits one exact-scene-bound composed zero-pending frame, and publishes it through a generation-aware lease; there is still no window or UI behavior"
dynamic_integration = "W3-A6D retains one direct-engine live DOM, applies an exact bounded atomic batch, and fully recomputes Stylo/layout/text/scene/headless output while tracking live revision separately from the last returned frame; no JS, task, navigation-facade, invalidation, or presentation connection"
linux_window_prerequisite = "W3-A6W adds an independently reviewed Wayland/X11 event shell over exact winit 0.30.13; it has no Wild Buzzard renderer/compositor presentation-surface connection and is not a browser window or UI"

