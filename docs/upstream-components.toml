]
notes = "Only the listed Rust core packages are active for x86_64 Linux. Imported SWGL, Wrench, examples, glsl-to-cxx, example compositor, and non-Linux platform source is excluded from the workspace or product scope: it is migration/reference material, not Wild Buzzard runtime code. The Rust core still uses third-party native GLSL/font tooling and test-only ANGLE at recorded Linux boundaries."
local_patches = [
  "Removed optional Firefox Glean/FOG dependencies for every feature combination.",
  "Removed the C++ SWGL feature from the active renderer manifest and narrowed workspace membership to Rust core packages.",
  "Removed the obsolete nightly-only WebRender API feature so the complete admitted feature set builds on stable Rust.",
  "Added a Linux x86_64-only first-party EGL/WebRender frame owner with bounded deterministic RGBA8 readback; it does not import Wrench, SWGL, Gecko bindings, or non-Linux presentation code.",
]

