editable = true
standalone_manifest = "js/brimstone/Cargo.toml"
active_manifests = [
  "js/brimstone/src/Cargo.toml",
  "js/brimstone/src/js/Cargo.toml",
  "js/brimstone/src/brimstone_icu_collections/Cargo.toml",
  "js/brimstone/src/brimstone_macros/Cargo.toml",
