local_patches = [
  "Added an exact-target standalone workspace and external-output build policy.",
  "Replaced active Gecko/XPCOM atoms, state, preference, thread, and profiler dependencies with narrow Rust Wild Buzzard contracts; Gecko features are explicit negative gates.",
  "Retained the real Mako property generator and made the imported layout.unimplemented metadata sentinel a direct false value instead of a fabricated preference.",
  "Enabled the ESR-facing :has() and :nth-child(... of ...) parser policy on the default profile and added focused parser, selector, cascade, CSSOM, and boundary tests.",
  "Made unsupported stylesheet URL shared-memory transfer return a structured error without writing.",
  "Pruned seven atoms used only by inactive Android, macOS, or Windows media-query code.",
]

