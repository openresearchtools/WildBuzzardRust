schema = 1
project = "Wild Buzzard"
imported_at = "2026-08-08"
supported_targets = ["x86_64-unknown-linux-gnu"]
release_artifacts = ["AppImage"]

[firefox_reference]
repository = "https://github.com/mozilla-firefox/firefox.git"
branch = "esr153"
revision = "c19b7e89270787889495688244ec6ee8e79288a1"
checkout = "firefox"
detached = true
full_history = true
build_dependency = false

# Status values:
# active             - independently buildable and admitted to development
# adaptation-required - reusable core that still carries Gecko/Firefox assumptions
# pinned-source       - exact source snapshot; establish an editable canonical workspace before modification
# quarantined         - present for extraction, but forbidden from production manifests
# transitional        - useful bootstrap code with a tracked native/legacy boundary

