[package]
name = "brimstone_core"
workspace = "../.."
version.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
doctest = false
path = "lib.rs"

[dependencies]
allocator-api2.workspace = true
bitflags.workspace = true
bumpalo = { workspace = true, features = ["allocator-api2"] }
clap = { workspace = true, features = ["derive"] }
cranelift-codegen = { workspace = true, optional = true }
cranelift-frontend = { workspace = true, optional = true }
cranelift-native = { workspace = true, optional = true }
half.workspace = true
hashbrown.workspace = true
indexmap-allocator-api.workspace = true
libc = { workspace = true, optional = true }
memchr.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
rand.workspace = true
rustc-hash.workspace = true
ryu-js.workspace = true
siphasher.workspace = true
supports-color.workspace = true
temporal_rs = { workspace = true, features = ["float64_representable_durations", "std"] }
timezone_provider = { workspace = true, features = ["tzif"] }
xsum.workspace = true

# Internal crates
brimstone_icu_collections.workspace = true
brimstone_macros.workspace = true

# ICU4X crates must all be the same version
icu_casemap.workspace = true
icu_collator.workspace = true
icu_collections.workspace = true
icu_locale.workspace = true
icu_normalizer.workspace = true
icu_properties= { workspace = true, features = ["alloc"] }
icu_provider = { workspace = true, features = ["sync"] }
icu_provider_baked.workspace = true
icu_provider_adapters.workspace = true
zerotrie.workspace = true
zerovec.workspace = true

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"

[features]
default = ["jemalloc"]
# Contained Linux x86-64 baseline-JIT infrastructure prototype. No product dispatch uses it.
baseline_jit = [
  "dep:cranelift-codegen",
  "dep:cranelift-frontend",
  "dep:cranelift-native",
  "dep:libc",
]
# Enable Annex B extensions by default
annex_b = []
# Run the garbage collector in stress test mode
gc_stress_test = []
# Collect handle use statistics
handle_stats = []
# Use the jemalloc allocator
jemalloc = []
# Do not use the jemalloc allocator, overrides the `jemalloc` feature
no_jemalloc = []
# Return allocation errors instead of panicking
alloc_error = []
# Enable features only available on nightly (e.g. never_type)
nightly = []

[lints]
workspace = true
