[package]
name = "style"
version = "0.0.1"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
repository = "https://github.com/servo/stylo"
edition = "2021"
description = "The Stylo CSS engine"

build = "build.rs"

# https://github.com/rust-lang/cargo/issues/3544
links = "servo_style_crate"

[lib]
name = "style"
path = "lib.rs"
doctest = false

[features]
default = ["wild_buzzard"]
wild_buzzard = ["servo", "dep:dom", "dep:static_prefs"]
gecko = []
servo = [
    "cssparser/serde",
    "encoding_rs",
    "malloc_size_of/servo",
    "web_atoms",
    "serde",
    "servo_arc/servo",
    "stylo_atoms",
    "string_cache",
    "style_traits/servo",
    "url",
    "selectors/to_shmem",
    "to_shmem/servo",
]
gecko_debug = []
gecko_refcount_logging = []

[dependencies]
app_units = "0.7.8"
arrayvec = "0.7"
atomic_refcell = "0.1"
bitflags = "2"
byteorder = "1.0"
cssparser = "0.37"
derive_more = { version = "2", features = ["add", "add_assign", "deref", "deref_mut", "from"] }
new_debug_unreachable = "1.0"
encoding_rs = {version = "0.8", optional = true}
euclid = "0.22"
dom = { package = "wild_buzzard_style_platform", path = "../wild_buzzard_style_platform", optional = true }
rustc-hash = "2.1.1"
icu_segmenter = { version = "2.0", default-features = false, features = ["auto", "compiled_data"] }
indexmap = {version = "2", features = ["std"]}
itertools = "0.14"
itoa = "1.0"
log = "0.4"
mime = "0.3"
malloc_size_of = { path = "../malloc_size_of" }
malloc_size_of_derive = { path = "../malloc_size_of_derive" }
web_atoms = { package = "wild_buzzard_web_atoms", path = "../wild_buzzard_web_atoms", optional = true }
num_cpus = {version = "1.1.0"}
num-integer = "0.1"
num-traits = "0.2"
num-derive = "0.4"
parking_lot = "0.12"
precomputed-hash = "0.1.1"
rayon = "1"
rayon-core = "1"
selectors = { path = "../selectors" }
serde = {version = "1.0", optional = true, features = ["derive"]}
servo_arc = { path = "../servo_arc" }
stylo_atoms = { package = "wild_buzzard_stylo_atoms", path = "../wild_buzzard_atoms", optional = true }
smallbitvec = "2.3.0"
smallvec = "1.0"
static_assertions = "1.1"
static_prefs = { package = "wild_buzzard_style_prefs", path = "../wild_buzzard_style_prefs", optional = true }
string_cache = { version = "0.8", optional = true }
strum = { version = "0.27", features = ["derive"] }
strum_macros = "0.27"
style_derive = {path = "../style_derive"}
style_traits = {path = "../style_traits"}
to_shmem = {path = "../to_shmem"}
to_shmem_derive = {path = "../to_shmem_derive"}
thin-vec = "0.2.1"
uluru = "3.0"
void = "1.0.2"
url = { version = "2.5", optional = true, features = ["serde"] }

[build-dependencies]
log = { version = "0.4", features = ["std"] }
walkdir = "2.1.4"
